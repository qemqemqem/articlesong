<!DOCTYPE html>
<html>
<head>
  <title>Article Song</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      width: 420px;
      max-height: 600px;
      background: #f7fafc;
      color: #2d3748;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 {
      font-size: 20px;
      font-weight: 700;
    }
    
    .header-actions {
      display: flex;
      gap: 8px;
    }
    
    .icon-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 6px 12px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    
    .content {
      max-height: 520px;
      overflow-y: auto;
      padding: 16px;
    }
    
    .section {
      margin-bottom: 20px;
    }
    
    #create-section {
      background: white;
      padding: 14px;
      border-radius: 10px;
      border: 2px solid #e2e8f0;
    }
    
    #create-section .section-title {
      margin-bottom: 12px;
      display: block;
    }
    
    .create-song-btn {
      font-size: 13px;
      padding: 10px 16px;
    }
    
    .custom-style-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 13px;
      border: 2px solid #cbd5e0;
      border-radius: 6px;
      background: white;
      margin-bottom: 8px;
      font-family: inherit;
      transition: all 0.2s;
    }
    
    .custom-style-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .custom-style-input::placeholder {
      color: #a0aec0;
      font-style: italic;
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .badge {
      background: #667eea;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }
    
    .request-card {
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    
    .request-card:hover {
      border-color: #cbd5e0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    
    .request-card.active {
      border-color: #667eea;
      background: #f0f4ff;
    }
    
    .request-card.streaming {
      border-color: #ed8936;
      background: #fffaf0;
    }
    
    .request-card.complete {
      border-color: #48bb78;
    }
    
    .request-card.failed {
      border-color: #f56565;
      background: #fff5f5;
    }
    
    .request-card.cancelled {
      border-color: #cbd5e0;
      background: #f7fafc;
      opacity: 0.8;
    }
    
    .request-card.streaming {
      border-color: #ed8936;
      background: #fffaf0;
    }
    
    .request-title {
      font-size: 15px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .request-status {
      font-size: 14px;
      color: #4a5568;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .status-icon {
      font-size: 16px;
    }
    
    .progress-bar {
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s;
      border-radius: 3px;
    }
    
    .request-meta {
      font-size: 12px;
      color: #718096;
      margin-bottom: 10px;
    }
    
    .request-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    .copy-section {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    
    .copy-section .btn {
      font-size: 11px;
      padding: 5px 10px;
      opacity: 0.9;
    }
    
    .copy-section .btn:hover {
      opacity: 1;
    }
    
    .now-playing {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 10px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    
    .now-playing-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    
    .now-playing-icon {
      font-size: 24px;
      font-weight: bold;
      opacity: 0.9;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    
    .now-playing-text {
      flex: 1;
      min-width: 0;
    }
    
    .now-playing-title {
      font-size: 11px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    
    .now-playing-subtitle {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .media-control-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    
    .media-control-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.6);
      transform: scale(1.05);
    }
    
    .media-control-btn:active {
      transform: scale(0.95);
    }
    
    .btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .btn-primary:hover {
      background: #5568d3;
    }
    
    .btn-secondary {
      background: #e2e8f0;
      color: #4a5568;
    }
    
    .btn-secondary:hover {
      background: #cbd5e0;
    }
    
    .btn-danger {
      background: #f56565;
      color: white;
    }
    
    .btn-danger:hover {
      background: #e53e3e;
    }
    
    .btn-success {
      background: #48bb78;
      color: white;
    }
    
    .btn-success:hover {
      background: #38a169;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #718096;
    }
    
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    
    .empty-state-text {
      font-size: 14px;
      line-height: 1.6;
    }
    
    .footer {
      padding: 12px 16px;
      border-top: 2px solid #e2e8f0;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .footer-btn {
      font-size: 12px;
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 5px;
      transition: background 0.2s;
    }
    
    .footer-btn:hover {
      background: #f0f4ff;
    }
    
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    .request-card.streaming .spinner {
      border-top-color: #ed8936;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .style-tag {
      display: inline-block;
      background: #e2e8f0;
      color: #4a5568;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    
    .error-message {
      font-size: 13px;
      color: #c53030;
      margin-top: 6px;
      line-height: 1.4;
    }
    
    /* Scrollbar styling */
    .content::-webkit-scrollbar {
      width: 8px;
    }
    
    .content::-webkit-scrollbar-track {
      background: #f7fafc;
    }
    
    .content::-webkit-scrollbar-thumb {
      background: #cbd5e0;
      border-radius: 4px;
    }
    
    .content::-webkit-scrollbar-thumb:hover {
      background: #a0aec0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Article Song</h1>
    <div class="header-actions">
      <button class="icon-btn" id="settings-btn" title="Settings">Settings</button>
    </div>
  </div>
  
  <div class="content">
    <!-- Now Playing Controls (hidden by default) -->
    <div class="now-playing" id="now-playing" style="display: none;">
      <div class="now-playing-info">
        <div class="now-playing-icon">~</div>
        <div class="now-playing-text">
          <div class="now-playing-title" id="now-playing-title">Now Playing</div>
          <div class="now-playing-subtitle" id="now-playing-subtitle">Song title</div>
        </div>
      </div>
      <button class="media-control-btn" id="play-pause-btn">
        <span id="play-pause-icon">||</span>
      </button>
    </div>
    
    <!-- Create New Song Section -->
    <div class="section" id="create-section">
      <div class="section-header">
        <span class="section-title">Create Song from Current Page</span>
      </div>
      <div id="create-buttons" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button class="btn btn-primary create-song-btn" data-style="musical">Musical</button>
        <button class="btn btn-primary create-song-btn" data-style="spoken">Spoken Word</button>
        <button class="btn btn-primary create-song-btn" data-style="meme">Meme</button>
        <button class="btn btn-primary create-song-btn" data-style="cute">Cute</button>
        <button class="btn btn-primary create-song-btn" data-style="informative">Informative</button>
        <button class="btn btn-primary create-song-btn" data-style="pop">Pop</button>
        <button class="btn btn-secondary create-song-btn" data-style="straight" style="grid-column: 1 / -1;">Use Page Text as Lyrics</button>
      </div>
      
      <div style="margin-top: 12px; padding-top: 12px; border-top: 2px solid #e2e8f0;">
        <input 
          type="text" 
          id="custom-style-input" 
          placeholder="style guidance" 
          class="custom-style-input"
        >
        <button class="btn btn-primary" id="custom-style-btn" style="width: 100%; font-size: 13px; padding: 10px 16px;">Create with Custom Style</button>
      </div>
    </div>
    
    <!-- Active Requests Section -->
    <div class="section" id="active-section">
      <div class="section-header">
        <span class="section-title">Active</span>
        <span class="badge" id="active-count">0</span>
      </div>
      <div id="active-requests">
        <!-- Active request cards will be injected here -->
      </div>
    </div>
    
    <!-- History Section -->
    <div class="section" id="history-section">
      <div class="section-header">
        <span class="section-title">Recent History</span>
        <span class="badge" id="history-count">0</span>
      </div>
      <div id="history-requests">
        <!-- History request cards will be injected here -->
      </div>
    </div>
    
    <!-- Empty State -->
    <div class="empty-state" id="empty-state">
      <div class="empty-state-icon">~</div>
      <div class="empty-state-text">
        No songs yet!<br>
        Right-click the extension icon and choose a song style to get started.
      </div>
    </div>
  </div>
  
  <div class="footer">
    <a href="#" class="footer-btn" id="clear-history-btn">Clear History</a>
    <span id="footer-status" style="font-size: 11px; color: #718096;"></span>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
