<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Article Song - Debug Logs</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      margin: 0;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    
    h1 {
      color: #4CAF50;
      margin-bottom: 10px;
    }
    
    .controls {
      margin-bottom: 20px;
      padding: 10px;
      background: #2d2d2d;
      border-radius: 4px;
    }
    
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-right: 10px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }
    
    button:hover {
      background: #45a049;
    }
    
    button.danger {
      background: #f44336;
    }
    
    button.danger:hover {
      background: #da190b;
    }
    
    .stats {
      margin-bottom: 20px;
      padding: 10px;
      background: #2d2d2d;
      border-radius: 4px;
      font-size: 14px;
    }
    
    .log-container {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 15px;
      max-height: 70vh;
      overflow-y: auto;
    }
    
    .log-entry {
      margin-bottom: 15px;
      padding: 10px;
      border-left: 4px solid #666;
      background: #1e1e1e;
    }
    
    .log-entry.info { border-left-color: #2196F3; }
    .log-entry.success { border-left-color: #4CAF50; }
    .log-entry.warning { border-left-color: #ff9800; }
    .log-entry.error { border-left-color: #f44336; }
    .log-entry.debug { border-left-color: #9c27b0; }
    
    .log-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 12px;
      color: #858585;
    }
    
    .log-level {
      font-weight: bold;
      text-transform: uppercase;
    }
    
    .log-message {
      color: #d4d4d4;
      margin-bottom: 5px;
    }
    
    .log-data {
      background: #1e1e1e;
      border: 1px solid #3e3e42;
      padding: 10px;
      margin-top: 5px;
      font-size: 12px;
      color: #858585;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #858585;
    }
  </style>
</head>
<body>
  <h1>🐛 Article Song - Debug Logs</h1>
  
  <div class="controls">
    <button id="refresh">🔄 Refresh</button>
    <button id="export">📥 Export to File</button>
    <button id="copy">📋 Copy to Clipboard</button>
    <button id="clear" class="danger">🗑️ Clear Logs</button>
  </div>
  
  <div class="stats">
    <strong>Total Logs:</strong> <span id="log-count">0</span> |
    <strong>Last Updated:</strong> <span id="last-updated">Never</span>
  </div>
  
  <div class="log-container" id="log-container">
    <div class="empty-state">No logs yet. Use the extension and logs will appear here!</div>
  </div>
  
  <script src="debug.js"></script>
</body>
</html>
